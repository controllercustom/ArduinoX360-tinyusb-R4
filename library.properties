name=ArduinoX360-tinyusb-R4
version=0.1.0
author=controllercustom
maintainer=controllercustom
sentence=Xbox 360 XInput gamepad emulation for Uno R4 Minima and Nano R4.
paragraph=TinyUSB vendor-class XInput backend on the UnoR4-tinyusb stack (vendored TinyUSB master in the UnoR4 TinyUSB Boards package). API matches the sibling library ArduinoX360-tinyusb: Button enum, triggers, sticks, hat, onRumble/onLed. Reports are loop-pumped: the sketch calls send()/update() (and pollRumble() for host rumble/LED packets) from loop(); there is no internal poll timer, so ArduinoX360-tinyusb's setPollInterval is not provided. Every example carries its own sketch-local tusb_config.h, so all sketches build in the plain Arduino IDE 2.x — no custom compiler flags. R4 boards only; no Adafruit TinyUSB, no Arduino-TinyUSB.
category=Communication
url=https://github.com/controllercustom/ArduinoX360-tinyusb-R4
architectures=renesas_uno
depends=UnoR4-tinyusb
includes=ArduinoX360_R4.h
license=MIT
